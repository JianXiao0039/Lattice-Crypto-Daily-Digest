name: Daily Lattice Crypto Digest

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Explicit YYYY-MM-DD target for bounded manual recovery"
        required: false
        type: string
  schedule:
    # Nominal 01:17 UTC; hosted schedule execution is not exact.
    - cron: "17 1 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-lattice-crypto-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Production smoke gate
        run: >-
          python -m pytest tests/test_public_report_pipeline.py tests/test_v41_cloud_ownership.py tests/test_v41_delivery_states.py --basetemp=.pytest_tmp
          -k "not local and not lower_authority and not permission and not official"
      - name: Resolve verified GitHub event clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('VERIFIED_EVENT_CREATED_AT=' + run['created_at'] + '\n')
          PY
      - name: Generate and privacy-gate provisional public candidate
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET_DATE" ]; then args+=(--target-date "$TARGET_DATE"); fi
          python -m lattice_digest.cloud_public_history --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/public-history" --receipt "$RUNNER_TEMP/public-history-receipt.json" | tee "$RUNNER_TEMP/public-history-gate.json"
          public_ref=$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"public-history-receipt.json")))["source_ref"])')
          python -m lattice_digest.cloud_daily --event-created-at "$VERIFIED_EVENT_CREATED_AT" --trigger "$GITHUB_EVENT_NAME" --output-root "$RUNNER_TEMP/cloud-canonical" --public-output "$RUNNER_TEMP/public-candidate" --public-history-root "$RUNNER_TEMP/public-history" --public-history-ref "$public_ref" "${args[@]}" | tee "$RUNNER_TEMP/cloud-generation-gate.json"
      - name: Independent production report and public privacy gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from lattice_digest.report_gate import verify
          from lattice_digest.public_report import inspect_tree
          root = Path(os.environ['RUNNER_TEMP'])
          context = json.loads((root/'cloud-canonical/audits/cloud-target.json').read_text('utf-8'))
          verify(root/'cloud-canonical', 'daily', context['target_date'])
          inspect_tree(root/'public-candidate')
          print('PRODUCTION_REPORT_GATE PASS; PUBLIC_PRIVACY_GATE PASS; REMOTE_PUBLICATION_GATE CANDIDATE_READY')
          PY
      - name: Retain sanitized failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-digest-diagnostics
          path: |
            ${{ runner.temp }}/public-history-gate.json
            ${{ runner.temp }}/cloud-generation-gate.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain only reviewed-shape public candidate
        uses: actions/upload-artifact@v4
        with:
          name: public-digest-candidate
          path: ${{ runner.temp }}/public-candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install reviewed publisher
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: public-digest-candidate
          path: ${{ runner.temp }}/public-candidate
      - name: Publish exact sanitized tree and independently read back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m lattice_digest.public_publisher --candidate "$RUNNER_TEMP/public-candidate" --remote "https://github.com/$GITHUB_REPOSITORY.git" --approve-reviewed-publication --use-gh-credentials --accept-superseded | tee "$RUNNER_TEMP/publication-receipt.json"
      - name: Retain public publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-publication-receipt
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
